project_id = "workforge-core"

[functions.hq-webflow-intake]
# Custom 256-bit integration key; the RPC verifies its hash before any write.
verify_jwt = false
entrypoint = "./functions/hq-webflow-intake/index.ts"

[functions.hq-ad-intake]
# Google secret-key hash / Meta HMAC; retries verify staff JWT and membership.
verify_jwt = false
entrypoint = "./functions/hq-ad-intake/index.ts"

[functions.hq-gmail]
verify_jwt = false

[functions.portfolio-calendar]
# Verifies the caller's Starr Auth token and active company access inside the function.
verify_jwt = false
entrypoint = "./functions/portfolio-calendar/index.ts"
